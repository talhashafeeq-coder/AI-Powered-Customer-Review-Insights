[supervisord]
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid
nodaemon=true

[program:mongod]
command=/usr/bin/mongod --bind_ip_all --dbpath /data/db
autorestart=true
stdout_logfile=/var/log/mongodb/mongod.out
stderr_logfile=/var/log/mongodb/mongod.err

[program:backend]
environment=PATH="/app/venv/bin"
directory=/app/backend
command=/app/venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000
autorestart=true
stdout_logfile=/var/log/backend/stdout.log
stderr_logfile=/var/log/backend/stderr.log

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autorestart=true
stdout_logfile=/var/log/nginx/stdout.log
stderr_logfile=/var/log/nginx/stderr.log










